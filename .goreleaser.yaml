# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: am

before:
  hooks:
    - go mod tidy

builds:
  - id: am
    main: ./cmd/am
    binary: am
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kuzhienterprises/AppleMusicTUI/internal/cmd.version={{ .Version }}

archives:
  - id: am
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
